const tbl=v=>`<div style="overflow-x:auto"><table><thead><tr>${['fN','fC','fPr','k1','fD','fU'].map(k=>`<th>${t(k)}</th>`).join('')}<th></th></tr></thead><tbody>${v.map(s=>`<tr style="${s.status!='active'?'opacity:.55':''}"><td><b>${esc(s.name)}</b></td><td><span class="chip" style="background:${CC[s.cat]}">${t(s.cat)}</span></td><td>${fm(s.price/(s.share||1))} / ${t('cyc')[s.cycle]}</td><td>${fm(mon(s))}</td><td>${fd(nxt(s))}</td><td>${t('use')[s.use]||''}</td><td data-id="${s.id}" style="white-space:nowrap"><button data-a="e">✎</button> <button data-a="d">✕</button></td></tr>`).join('')}</tbody></table></div>`;

function look(){$('#fm').onsubmit=e=>e.preventDefault();const sw=(a,k,sel,rad,bg)=>a.map((d,i)=>`<button type="button" data-${k}="${i}" title="${i+1}" style="width:42px;height:42px;border-radius:${rad};padding:0;border:3px solid ${(S[sel]||0)==i?'var(--tx)':'transparent'};background:${bg(d)}"></button>`).join('');$('#fm').innerHTML=`<h2>🎨</h2><div style="display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px">${sw(TH,'th','th','50%',d=>`linear-gradient(135deg,${d[1]},${d[2]} 55%,${d[3]})`)}</div><h2>🖼️</h2><div style="display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 16px">${sw(BGS,'bg','bg','10px',b=>b?b[0]:'linear-gradient(135deg,#f5f6fb 50%,#0f1117 50%)')}</div><div style="text-align:right"><button type="button" class="p" id="x">OK</button></div>`;$('#x').onclick=()=>$('#dg').close();if(!$('#dg').open)$('#dg').showModal()}
async function dl(){let h;try{h=await(await fetch(location.href)).text()}catch(e){h='<!doctype html>\n'+document.documentElement.outerHTML}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='subtrack.html';document.body.appendChild(a);a.click();a.remove()}
function fillSel(){$('#lang').innerHTML=Object.entries({de:'Deutsch',en:'English',es:'Español',fr:'Français',it:'Italiano',pt:'Português',nl:'Nederlands',ko:'한국어',zh:'中文',ar:'العربية',hi:'हिन्दी',id:'Bahasa Indonesia',vi:'Tiếng Việt',sv:'Svenska',th:'ไทย',uk:'Українська',el:'Ελληνικά',cs:'Čeština',ro:'Română',hu:'Magyar',da:'Dansk',no:'Norsk',fi:'Suomi',he:'עברית',fa:'فارسی',bn:'বাংলা',pl:'Polski',ru:'Русский',ja:'日本語',tr:'Türkçe'}).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');let dn;try{dn=new Intl.DisplayNames([S.lang],{type:'currency'})}catch(e){}$('#cur').innerHTML=['EUR','USD','GBP','CHF','TRY','JPY','CNY','INR','BRL','CAD','AUD','PLN','SEK','NOK','DKK','CZK','AED','SAR','MXN','KRW','RUB','ZAR','NZD','SGD','HKD','THB','HUF','RON','ILS'].map(c=>{let n='';try{n=dn?' – '+dn.of(c):''}catch(e){}return`<option value="${c}">${c}${n}</option>`}).join('');$('#lang').value=S.lang;$('#cur').value=S.cur}
function render(){
document.documentElement.lang=S.lang;document.documentElement.dir=['ar','he','fa'].includes(S.lang)?'rtl':'ltr';look0();$('#lang').value=S.lang;$('#cur').value=S.cur;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
const A=S.subs.filter(s=>s.status=='active'),M=A.reduce((a,s)=>a+mon(s),0),nx=A.map(s=>({s,d:nxt(s)})).sort((a,b)=>a.d-b.d);
$('#kp').innerHTML=[[t('k1'),fm(M)],[t('k2'),fm(M*12)],[t('k3'),A.length],[t('k4'),nx[0]?esc(nx[0].s.name)+' · '+fd(nx[0].d):'–']].map((x,i)=>`<div class="c k" style="border-top:4px solid ${['#6366f1','#ec4899','#22c55e','#f59e0b'][i]}"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('');
const soon=nx.filter(x=>dd(x.d)<=7);
$('#ban').innerHTML=!S.premium?(A.length?`<div class="ban" style="border-color:var(--br);background:var(--card)">${t('lR')}</div>`:''):soon.length?`<div class="ban">🔔 ${t('due',{l:soon.map(x=>esc(x.s.name)+' ('+rel(dd(x.d))+')').join(', ')})}</div>`:'';
$('#tabs').innerHTML=['all',...CATS].map(c=>`<button class="${S.f==c?'on':''}" data-f="${c}">${c=='all'?'':`<i class="dot" style="background:${CC[c]}"></i>`}${t(c)}</button>`).join('');
const vis=S.subs.filter(s=>S.f=='all'||s.cat==S.f);
$('#list').innerHTML=S.view=='table'&&vis.length?tbl(vis):S.view=='chart'&&vis.length?sch(vis):vis.length?vis.map(s=>{const d=nxt(s),n=dd(d),st=s.status;return`<div class="s" style="border-left:4px solid ${CC[s.cat]};padding-left:10px">${av(s)}<div class="m"><b>${esc(s.name)}${s.trial?`<span class="bd w2">${t('trial')}</span>`:''}${st!='active'?`<span class="bd e">${t(st)}</span>`:''}</b><small>${esc(s.plan||t(s.cat))} · ${t('use')[s.use]||''}${st=='active'?' · '+fd(d)+' ('+rel(n)+')':''}${s.share>1?' · ÷'+s.share:''}</small>
<div class="act" data-id="${s.id}"><button data-a="e">${t('edit')}</button><button data-a="p">${t(st=='paused'?'resume':'pause')}</button><button data-a="c">${t('cancel')}</button><button data-a="d">${t('del')}</button></div></div><div class="pr">${fm(s.price/(s.share||1))}<small>/ ${t('cyc')[s.cycle]}</small></div></div>`}).join('')
:`<div class="em">${t('empty')}<div><button class="p" id="dm">${t('demo')}</button></div></div>`;
const by={};A.forEach(s=>by[s.cat]=(by[s.cat]||0)+mon(s));
$('#ch').innerHTML=(M&&S.cm=='donut'?donut(by,M):M?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="row"><div class="t"><span><i class="dot" style="background:${CC[c]}"></i>${t(c)}</span><span>${fm(v)} · ${Math.round(v/M*100)}%</span></div><div class="tr"><i style="width:${v/M*100}%;background:${CC[c]}"></i></div></div>`).join(''):`<div class="em">–</div>`)+`<details><summary>${t('info')}</summary>${t('infoT')}</details>`;
const tp=[];
A.filter(s=>s.use=='rarely').forEach(s=>tp.push(t('tRare',{n:esc(s.name),v:fm(mon(s)*12)})+' '+t('tPause')));
A.filter(s=>s.trial&&dd(nxt(s))<=7).forEach(s=>tp.push(t('tTrial',{n:esc(s.name),d:fd(nxt(s))})));
CATS.forEach(c=>{const g=A.filter(s=>s.cat==c&&(c=='Video'||c=='Music'));if(g.length>1)tp.push(t('tMany',{c:t(c),n:g.length,v:fm(g.reduce((a,s)=>a+mon(s),0))}))});
if(S.budget>0&&M>S.budget)tp.push(t('tOver',{v:fm(M-S.budget)}));





$('#tp').innerHTML=!S.premium?(tp.length?`<div class="tip">🔒 ${t('lT',{n:tp.length})}</div><button class="p" data-pm="1" style="margin-top:6px">${t('pAct')}</button>`:`<div class="em" style="padding:8px">${t('noTip')}</div>`):tp.length?tp.map(x=>`<div class="tip">${x}</div>`).join(''):`<div class="em" style="padding:8px">${t('noTip')}</div>`;
const p=S.budget>0?Math.min(100,M/S.budget*100):0;
$('#bu').innerHTML=`<div class="t" style="display:flex;justify-content:space-between;font-size:13px"><span>${S.budget>0?t('bof',{a:fm(M),b:fm(S.budget)}):t('bnone')}</span></div><div class="tr"><i style="width:${p}%;background:${M>S.budget&&S.budget>0?'var(--er)':'var(--ok)'}"></i></div><label>${t('bset')} (${S.cur})<div style="display:flex;gap:8px"><input id="bi" type="number" min="0" step="1" value="${S.budget||''}"><button id="bs">${t('bsave')}</button></div></label>${S.subs.length?`<button class="g" id="cl" style="margin-top:10px;font-size:12px">${t('clear')}</button>`:''}`;

sv()}
function form(id){const s=S.subs.find(x=>x.id==id)||{name:'',plan:'',cat:'Other',price:'',cycle:'monthly',next:iso(T0()),use:'unsure',share:1,trial:false,note:''};
